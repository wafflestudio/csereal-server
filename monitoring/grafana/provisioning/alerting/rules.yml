# 경보 규칙. 대시보드·데이터소스와 같게 파일이 정본이다(UI 에서 고치면 재기동 때 되돌아간다).
#
# 규칙은 전부 "이미 수집 중인 지표"로만 짰다. 새로 계측할 게 없다.
apiVersion: 1

groups:
    - orgId: 1
      name: csereal
      folder: 경보
      interval: 1m
      rules:
          # 가장 기본. Slack appender 로는 못 잡던 것이다 — 앱이 죽으면 로그도 안 나온다.
          - uid: app-down
            title: 앱이 응답하지 않는다
            condition: C
            for: 2m
            annotations:
                summary: "백엔드 스크랩이 2분 넘게 실패한다. 앱이 죽었거나 8080 이 막혔다."
            labels: { severity: critical }
            data: &q_app_down
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                      expr: up{job="spring"}
                      instant: true
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: lt, params: [1] }
                      refId: C

          # Slack appender 가 하던 일의 대체. 다만 "무슨 에러인지"는 안 온다 —
          # 알림을 받고 로그를 보러 가야 한다.
          - uid: error-rate
            title: 에러 로그가 늘고 있다
            condition: C
            for: 5m
            annotations:
                summary: "5분 평균 ERROR 로그가 초당 0.1건을 넘는다. 로그를 확인할 것."
            labels: { severity: warning }
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      expr: sum(rate(logback_events_total{level="error"}[5m]))
                      instant: true
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: gt, params: [0.1] }
                      refId: C

          # 사용자가 실제로 겪는 실패.
          - uid: http-5xx
            title: 5xx 응답이 나가고 있다
            condition: C
            for: 5m
            annotations:
                summary: "5분 평균 5xx 응답이 발생 중이다."
            labels: { severity: warning }
            data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                      expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
                      instant: true
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: gt, params: [0] }
                      refId: C

          # 하트비트. ops 컨테이너가 백업에 성공할 때만 값이 갱신된다.
          # 컨테이너가 죽든 덤프가 실패하든 디스크가 차든 — 원인과 무관하게 값이 늙는다.
          - uid: backup-stale
            title: DB 백업이 25시간 넘게 성공하지 않았다
            condition: C
            for: 10m
            annotations:
                summary: "마지막 성공 이후 25시간이 지났다. docker logs csereal_ops 확인."
            labels: { severity: critical }
            data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                      expr: time() - csereal_db_backup_last_success_timestamp_seconds
                      instant: true
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: gt, params: [90000] }
                      refId: C

          # 호스트 디스크. node-exporter 가 들어와서 비로소 가능해졌다.
          - uid: disk-low
            title: 디스크 여유가 10GB 미만이다
            condition: C
            for: 10m
            annotations:
                summary: "루트 파일시스템 여유 공간이 부족하다. 백업 파일(~3GB)과 도커 이미지를 먼저 볼 것."
            labels: { severity: warning }
            data:
                - refId: A
                  relativeTimeRange: { from: 300, to: 0 }
                  datasourceUid: prometheus
                  model:
                      expr: min(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"})
                      instant: true
                      refId: A
                - refId: C
                  datasourceUid: __expr__
                  model:
                      type: threshold
                      expression: A
                      conditions:
                          - evaluator: { type: lt, params: [10000000000] }
                      refId: C
