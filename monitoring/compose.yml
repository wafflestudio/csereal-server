# 모니터링 스택. 앱 배포와 분리된 별도 compose 프로젝트다 —
# 앱을 배포할 때마다 대시보드가 재시작되면 곤란하고, 반대로 모니터링을 만지다
# 앱을 건드리는 것도 곤란하다.
#
#   docker compose -f monitoring/compose.yml up -d
#
# 두 포트 모두 loopback 에만 바인딩한다. 전엔 프로메테우스가 0.0.0.0:9090 이라
# 학외에서 무인증으로 /api/v1/* 이 응답했다(2026-09-06 실측·차단). 호스트에
# 방화벽이 없어(ufw 미설치, iptables INPUT ACCEPT) 게시 포트가 곧 공개 포트다.
#
# 보려면 SSH 터널을 쓴다:
#   ssh -p 9122 -L 9090:localhost:9090 -L 3001:localhost:3001 waffle@<host>
name: monitoring

services:
    prometheus:
        image: prom/prometheus:v3.14.0
        container_name: prometheus
        ports:
            - "127.0.0.1:9090:9090"
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus-data:/prometheus
        # 앱은 별도 compose 프로젝트(app)에 있어 서비스 이름으로 못 닿는다.
        # 앱이 MySQL 에 붙는 방식과 같게 호스트 게이트웨이를 거친다.
        extra_hosts:
            - host.docker.internal:host-gateway
        restart: unless-stopped

    grafana:
        image: grafana/grafana:13.2.1
        container_name: grafana
        # 호스트 3000 은 프론트가 쓰므로 3001 로 낸다.
        ports:
            - "127.0.0.1:3001:3000"
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            # 대시보드 JSON. provisioning/dashboards/dashboards.yml 이 이 경로를 읽는다.
            - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        environment:
            # 호스트 .env 에서 온다. 없으면 admin 으로 뜨니 최초 접속 후 반드시 바꿀 것.
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
            GF_USERS_ALLOW_SIGN_UP: "false"
            GF_ANALYTICS_REPORTING_ENABLED: "false"
        depends_on:
            - prometheus
        restart: unless-stopped

volumes:
    # 전엔 볼륨이 없어 컨테이너를 다시 만들 때마다 지표가 사라졌다.
    prometheus-data:
    grafana-data:
