# 예약 실행되는 운영 작업(백업). 앱과 분리된 별도 compose 프로젝트다.
#   docker compose -f compose.ops.yml up -d --build
name: ops

services:
    ops:
        build: ./ops
        container_name: csereal_ops
        # DB 계정은 앱과 같은 것을 쓴다. 따로 두면 갈라져서 백업이 조용히 틀린
        # 계정으로 돌게 된다. ⚠️ 절대경로로 두지 말 것 — 호스트마다 홈이 다르다.
        env_file:
            - ../secrets/app.env
        environment:
            TZ: Asia/Seoul # 19:00 스케줄과 파일명 날짜의 기준
            BACKUP_DIR: /backup
            METRICS_DIR: /metrics
            DB_CONTAINER: csereal_db_container
            # 오프사이트 복사 대상(staging 호스트).
            OFFSITE_HOST: ubuntu@168.107.16.249
            OFFSITE_PATH: db-backup-from-prod/
        volumes:
            # DB 컨테이너 안 mysqldump 를 부르기 위해. ⚠️ 소켓은 root 권한과 등가다.
            - /var/run/docker.sock:/var/run/docker.sock
            # 덤프가 쌓이는 곳.
            - ../database/backup:/backup
            # 하트비트 지표. node_exporter 가 같은 볼륨을 읽는다.
            - ops-metrics:/metrics
            # 오프사이트 복사용 전용 SSH 키.
            - ../secrets/backup_offsite:/secrets/backup_offsite:ro
        restart: unless-stopped
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

volumes:
    ops-metrics:
