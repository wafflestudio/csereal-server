# 앱 배포. main → production, develop → staging.
# 환경별 값은 .github/deploy-targets/<브랜치>.env (설명은 그 디렉터리의 README).
name: deploy

on:
    push:
        branches:
            - main
            - develop
        # 경로 필터를 두지 않는다(의도적) — 허용목록에 없는 파일이 새로 생기면
        # 배포가 조용히 안 된다. 헛배포가 그 위험보다 싸다.

# 겹치면 늦게 끝난 쪽이 이겨 옛 커밋이 배포될 수 있고, 그게 조용하다(양쪽 다 초록불).
# cancel-in-progress: false — SSH 로 up 도는 중에 끊기면 호스트가 중간 상태로 남는다.
concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    build-and-deploy:
        # ⚠️ 러너 arch = 대상 호스트 arch. platforms 를 안 주면 러너 네이티브로 빌드되므로
        #    어긋나면 호스트가 실행할 수 없는 이미지가 나온다(prod x86_64 / staging aarch64).
        #    deploy-targets 로 못 뺀다 — runs-on 은 스텝이 돌기 전에 평가된다.
        runs-on: ${{ github.ref_name == 'main' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
        environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        permissions:
            packages: write
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # 이후 스텝은 env.SSH_HOST 처럼 쓴다.
            # ⚠️ cat 으로 바꾸지 말 것 — $GITHUB_ENV 는 주석 줄을 거부한다.
            - name: 배포 대상 설정 읽기
              run: grep -vE '^\s*(#|$)' .github/deploy-targets/${{ github.ref_name }}.env >> "$GITHUB_ENV"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/wafflestudio/csereal-server/server_image:${{ env.PROFILE }}
                      ghcr.io/wafflestudio/csereal-server/server_image:${{ github.sha }}

            # nori 는 공식 이미지에 없는 플러그인이라 검색 서버도 우리가 만들어 올린다.
            # 태그가 내용 해시라 Dockerfile.es 가 그대로면 다시 밀지 않는다 — 다이제스트가
            # 안 바뀌어야 compose 가 ES 를 재생성하지 않는다.
            # arch 를 붙이는 이유: 내용이 같아도 amd64·arm64 이미지는 서로 다르다.
            - name: 검색 이미지 태그 계산
              run: |
                  H=$(git ls-tree HEAD -- Dockerfile.es | sha256sum | cut -c1-12)
                  echo "SEARCH_TAG=${H}-$(dpkg --print-architecture)" >> "$GITHUB_ENV"

            - name: 검색 이미지가 이미 있나
              id: search_image
              run: |
                  REF=ghcr.io/wafflestudio/csereal-server/search_image:${SEARCH_TAG}
                  if docker manifest inspect "$REF" >/dev/null 2>&1; then
                    echo "  이미 있다 → 빌드 건너뜀: $REF"
                    echo "hit=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "  없다 → 빌드한다: $REF"
                    echo "hit=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build and push search image
              if: steps.search_image.outputs.hit != 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile.es
                  push: true
                  tags: |
                      ghcr.io/wafflestudio/csereal-server/search_image:${{ env.SEARCH_TAG }}

            # OIDC 등록은 prod 프로파일에만 있다(application.yaml). staging 은 mock-login 만 쓴다.
            - name: Create .env file
              run: |
                  echo "# deploy.yaml 이 매 배포마다 덮어쓴다. 여기서 고치지 말 것." > .env
                  echo "PROFILE=${{ env.PROFILE }}" >> .env
                  echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> .env
                  echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
                  echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
                  echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
                  echo "URL=${{ env.URL }}" >> .env
                  echo "SEARCH_TAG=${{ env.SEARCH_TAG }}" >> .env
                  if [ "${{ env.PROFILE }}" = "prod" ]; then
                    echo "OIDC_CLIENT_SECRET=${{ secrets.OIDC_CLIENT_SECRET }}" >> .env
                  fi

            - name: SCP Command to Transfer Files
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  port: ${{ env.SSH_PORT }}
                  # 환경이 고른다. staging Environment 의 SSH_KEY 가 레포 수준 값(prod)을 덮어쓴다.
                  key: ${{ secrets.SSH_KEY }}
                  source: "compose.yml, compose.prod.yml, .env"
                  target: "~/app"
                  overwrite: true

            - name: SSH Remote Commands
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  port: ${{ env.SSH_PORT }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd ~/app
                      source .env
                      docker compose -f compose.yml -f compose.prod.yml pull
                      # down 을 쓰지 않는다 — compose 는 바뀐 서비스만 재생성하는데 down 이
                      # 그걸 무력화한다. --remove-orphans 가 down 의 정리 역할을 대신한다.
                      docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
