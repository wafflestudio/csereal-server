# 앱 배포. main → production, develop → staging 을 한 파일이 담당한다.
#
# 이미지는 **소스 내용 해시**를 태그로 쓰는 멀티아키텍처 매니페스트다.
# 같은 소스면 이미 있는 이미지를 그대로 쓰고 빌드를 건너뛴다 — develop 에서 만든 것을
# main 승격 때 그대로 재사용한다(실측: 최근 main 머지 5건 중 4건이 develop 과 트리 동일).
#
# 전엔 아키텍처별로 따로 빌드해 :prod·:dev 라는 움직이는 태그에 밀었다. 그래서
# ① 승격 때마다 같은 소스를 다시 빌드했고
# ② prod 가 staging 에서 한 번도 안 돌려본 산출물을 실행했으며
# ③ 롤백하려면 다시 빌드해야 했다(태그가 움직이니 옛 이미지를 가리킬 방법이 없었다).
#
# 환경마다 다른 값은 .github/deploy-targets/<브랜치>.env 에 있다.
name: deploy

on:
    push:
        branches:
            - main
            - develop
        # 경로 필터를 두지 않는다. 허용목록이던 시절 실측으로 25 커밋 중 2번만 배포를 아꼈는데,
        # 목록에 없는 파일이 새로 생기면 배포가 조용히 안 되는 위험을 늘 안고 있었다.
        # 헛배포는 싸다 — 이제 소스가 같으면 빌드도 건너뛴다.

# 배포가 겹치면 최종 상태가 최신 커밋이라는 보장이 사라진다. 늦게 끝난 쪽이 이기는데
# 그게 조용하다(양쪽 다 초록불). cancel-in-progress: false — SSH 로 up 도는 중에 취소되면
# 호스트가 중간 상태로 남는다.
concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

env:
    APP_IMAGE: ghcr.io/wafflestudio/csereal-server/server_image
    SEARCH_IMAGE: ghcr.io/wafflestudio/csereal-server/search_image

jobs:
    # 태그(=소스 내용 해시)를 정하고, 이미 레지스트리에 있는지 본다.
    plan:
        runs-on: ubuntu-latest
        permissions: { packages: read, contents: read }
        outputs:
            app_tag: ${{ steps.tags.outputs.app_tag }}
            search_tag: ${{ steps.tags.outputs.search_tag }}
            app_hit: ${{ steps.check.outputs.app_hit }}
            search_hit: ${{ steps.check.outputs.search_hit }}
        steps:
            - uses: actions/checkout@v7

            # 이미지에 들어가는 것만 해시한다. 문서·compose 만 바뀐 커밋은 같은 태그가 나와
            # 빌드를 통째로 건너뛴다.
            - name: 태그 계산
              id: tags
              run: |
                  app=$(git ls-tree HEAD -- src build.gradle.kts settings.gradle.kts gradle gradlew Dockerfile | sha256sum | cut -c1-12)
                  search=$(git ls-tree HEAD -- Dockerfile.es | sha256sum | cut -c1-12)
                  echo "app_tag=$app" >> "$GITHUB_OUTPUT"
                  echo "search_tag=$search" >> "$GITHUB_OUTPUT"
                  echo "앱=$app  검색=$search"

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 이미 있는지 확인
              id: check
              run: |
                  # 값만 stdout 으로 내고 설명은 stderr 로 보낸다(명령치환에 섞이지 않게).
                  probe() {
                    if docker manifest inspect "$1" >/dev/null 2>&1; then
                      echo "  있다 → 건너뜀: $1" >&2; printf true
                    else
                      echo "  없다 → 빌드:   $1" >&2; printf false
                    fi
                  }
                  echo "app_hit=$(probe "$APP_IMAGE:${{ steps.tags.outputs.app_tag }}")" >> "$GITHUB_OUTPUT"
                  echo "search_hit=$(probe "$SEARCH_IMAGE:${{ steps.tags.outputs.search_tag }}")" >> "$GITHUB_OUTPUT"

    # 아키텍처별로 네이티브 러너에서 빌드해 다이제스트만 밀어 올린다.
    # QEMU 에뮬레이션을 쓰지 않는 이유: Kotlin 컴파일이 몇 배로 느려진다.
    build:
        needs: plan
        if: needs.plan.outputs.app_hit != 'true' || needs.plan.outputs.search_hit != 'true'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { arch: amd64, runner: ubuntu-latest }
                    - { arch: arm64, runner: ubuntu-24.04-arm }
        runs-on: ${{ matrix.runner }}
        permissions: { packages: write, contents: read }
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: 앱 이미지
              id: app
              if: needs.plan.outputs.app_hit != 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/${{ matrix.arch }}
                  outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true

            # nori 는 공식 이미지에 없는 플러그인이라 검색 서버도 우리가 만들어 올린다.
            - name: 검색 이미지
              id: search
              if: needs.plan.outputs.search_hit != 'true'
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile.es
                  platforms: linux/${{ matrix.arch }}
                  outputs: type=image,name=${{ env.SEARCH_IMAGE }},push-by-digest=true,name-canonical=true,push=true

            - name: 다이제스트 저장
              run: |
                  # `[ -n ... ] && echo` 로 쓰지 말 것 — 값이 비면 그 줄이 1 을 반환해
                  # 스텝 전체가 실패한다(빌드를 건너뛴 이미지는 다이제스트가 비어 있다).
                  mkdir -p /tmp/d
                  if [ -n "${{ steps.app.outputs.digest }}" ]; then
                    echo "${{ steps.app.outputs.digest }}" > "/tmp/d/app-${{ matrix.arch }}"
                  fi
                  if [ -n "${{ steps.search.outputs.digest }}" ]; then
                    echo "${{ steps.search.outputs.digest }}" > "/tmp/d/search-${{ matrix.arch }}"
                  fi
                  ls -la /tmp/d

            - uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.arch }}
                  path: /tmp/d/*
                  if-no-files-found: ignore
                  retention-days: 1

    # 아키텍처별 다이제스트를 하나의 매니페스트로 묶어 태그를 붙인다.
    merge:
        needs: [plan, build]
        if: ${{ !cancelled() && needs.build.result == 'success' }}
        runs-on: ubuntu-latest
        permissions: { packages: write, contents: read }
        steps:
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/download-artifact@v4
              with: { pattern: digests-*, merge-multiple: true, path: /tmp/d }

            - name: 매니페스트 만들기
              run: |
                  make_manifest() {
                    image=$1; tag=$2; prefix=$3
                    refs=""
                    for f in "/tmp/d/${prefix}"-*; do
                      [ -e "$f" ] || continue
                      refs="$refs ${image}@$(cat "$f")"
                    done
                    [ -n "$refs" ] || { echo "  $prefix: 다이제스트 없음(빌드 건너뜀) — 매니페스트 생략"; return; }
                    # shellcheck disable=SC2086
                    docker buildx imagetools create -t "${image}:${tag}" $refs
                    echo "  $prefix → ${image}:${tag}"
                  }
                  make_manifest "$APP_IMAGE" "${{ needs.plan.outputs.app_tag }}" app
                  make_manifest "$SEARCH_IMAGE" "${{ needs.plan.outputs.search_tag }}" search

    # 배포 잡은 이미지를 만들지 않으므로 아키텍처와 무관하다.
    # 전엔 여기서 빌드해서 러너를 대상 호스트에 맞춰야 했다(main=x86, develop=arm).
    deploy:
        needs: [plan, build, merge]
        if: ${{ !cancelled() && needs.build.result != 'failure' && needs.merge.result != 'failure' }}
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
        steps:
            - uses: actions/checkout@v7

            # 대상별 값을 부어 넣는다. 이후 스텝은 env.SSH_HOST 처럼 쓴다.
            # ⚠️ cat 으로 되돌리지 말 것 — $GITHUB_ENV 는 주석 줄을 거부한다
            #    (`Invalid format '# staging'`). 파일의 주석은 사람 몫이라 남긴다.
            - name: 배포 대상 설정 읽기
              run: grep -vE '^\s*(#|$)' .github/deploy-targets/${{ github.ref_name }}.env >> "$GITHUB_ENV"

            # OIDC 는 prod 프로파일에만 등록돼 있다(application.yaml). staging 은 mock-login 만
            # 쓰므로 넘길 것이 없다.
            - name: Create .env file
              run: |
                  {
                    echo "# deploy.yaml 이 매 배포마다 덮어쓴다. 여기서 고치지 말 것."
                    echo "PROFILE=${{ env.PROFILE }}"
                    echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}"
                    echo "MYSQL_USER=${{ secrets.MYSQL_USER }}"
                    echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}"
                    echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}"
                    echo "URL=${{ env.URL }}"
                    echo "IMAGE_TAG=${{ needs.plan.outputs.app_tag }}"
                    echo "SEARCH_TAG=${{ needs.plan.outputs.search_tag }}"
                  } > .env
                  if [ "${{ env.PROFILE }}" = "prod" ]; then
                    echo "OIDC_CLIENT_SECRET=${{ secrets.OIDC_CLIENT_SECRET }}" >> .env
                  fi

            - name: SCP Command to Transfer Files
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  port: ${{ env.SSH_PORT }}
                  # 환경이 고른다. staging Environment 의 SSH_KEY 가 레포 수준 값(prod)을 덮어쓴다.
                  key: ${{ secrets.SSH_KEY }}
                  source: "compose.yml, compose.prod.yml, .env"
                  target: "~/app"
                  overwrite: true

            - name: SSH Remote Commands
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  port: ${{ env.SSH_PORT }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd ~/app
                      source .env
                      docker compose -f compose.yml -f compose.prod.yml pull
                      # down 을 쓰지 않는다. compose 는 이미지·설정이 바뀐 서비스만 재생성하는데
                      # down 이 그걸 무력화해 매 배포마다 전부 내렸다 재생성했다.
                      # --remove-orphans 는 down 이 해주던 "파일에서 사라진 서비스 정리"를 대신한다.
                      docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
