# 앱과 엣지(Caddy) 배포. main → production, develop → staging.
name: deploy

on:
    push:
        branches:
            - main
            - develop

# 겹치면 늦게 끝난 쪽이 이겨 옛 커밋이 배포될 수 있고, 그게 조용하다(양쪽 다 초록불).
# cancel-in-progress: false — 호스트에서 빌드·up 도는 중에 끊기면 중간 상태로 남는다.
concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # 이후 스텝은 env.SSH_HOST 처럼 쓴다.
            - name: 배포 대상 설정 읽기
              run: grep -vE '^\s*(#|$)' .github/deploy-targets/${{ github.ref_name }}.env >> "$GITHUB_ENV"

            # 원격 출력이 이 로그로 그대로 흘러나온다(gradle 진행 상황 포함).
            # ssh 를 직접 부른다. 서드파티 액션을 쓰면 우리 SSH 개인키를 그 액션에
            # 넘겨야 하는데, 여기서 유출되면 두 호스트가 통째로 열린다.
            - name: 호스트에서 빌드·배포
              env:
                  SSH_KEY: ${{ secrets.SSH_KEY }}
                  GIT_SHA: ${{ github.sha }}
              run: |
                  install -m 600 /dev/stdin key <<<"$SSH_KEY"
                  timeout 15m ssh -i key -p "$SSH_PORT" \
                      -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
                      "$SSH_USER@$SSH_HOST" \
                      GIT_SHA="$GIT_SHA" PROFILE="$PROFILE" URL="$URL" \
                      CADDYFILE="$CADDYFILE" CERTIFICATE="${CERTIFICATE:-}" PRIVATE_KEY="${PRIVATE_KEY:-}" \
                      'bash -s' <<'REMOTE'
                  set -e
                  mkdir -p ~/proxy
                  W=~/build/csereal-server
                  [ -d "$W/.git" ] || git clone -q https://github.com/wafflestudio/csereal-server.git "$W"
                  cd "$W"
                  git fetch -q origin
                  # 추적 파일만 맞춘다. build/ 와 .gradle/ 은 남겨야 증분 컴파일이 산다.
                  git reset -q --hard "$GIT_SHA"
                  bash ops/host-deploy.sh
                  REMOTE
