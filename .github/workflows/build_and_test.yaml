on:
  pull_request:
    branches:
      - main
      - develop
  # gradle 캐시는 기본 브랜치에서 만든 것만 다른 브랜치가 읽을 수 있다(GitHub 캐시 격리 규칙).
  # PR 에서만 돌리면 캐시가 영원히 비므로 develop에서도 돌린다.
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - uses: 'actions/checkout@v7'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
