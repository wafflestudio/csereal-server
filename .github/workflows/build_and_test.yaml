on:
  pull_request:
    branches:
      - main
      - develop
  # develop(기본 브랜치) push 에도 도는 이유: gradle 캐시는 기본 브랜치에서 만든 것만
  # 다른 브랜치가 읽을 수 있다. PR 에서만 돌리면 캐시가 영원히 빈다.
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - uses: 'actions/checkout@v7'

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # gradle 배포판·의존성을 런 사이에 재사용한다. 없으면 첫 태스크까지 64초가 더 든다.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # `build` = assemble + check 라 테스트와 ktlint 를 모두 포함한다(별도 ktlint 워크플로 없음).
      - name: Build with Gradle
        run: ./gradlew build

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: build/test-results/**/*.xml
