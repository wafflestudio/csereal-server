# 엣지(Caddy) 배포. main → production, develop → staging.
# 이미지를 만들지 않는다 — caddy 공식 이미지를 호스트가 직접 받는다.
name: proxy

on:
    push:
        branches:
            - main
            - develop
        paths:
            - compose.caddy.yml
            - caddy/Caddyfile
            - caddy/Caddyfile.dev
            - .github/workflows/proxy.yaml

# 엣지 설정이라 겹치면 안 된다. 끊기면 어중간한 상태로 남는다.
concurrency:
    group: proxy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    proxy-initialize:
        # arch 는 무관하다(이미지를 안 만든다). deploy.yaml 과 형태만 맞춰 둔 것.
        runs-on: ${{ github.ref_name == 'main' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
        environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # ⚠️ cat 으로 바꾸지 말 것 — $GITHUB_ENV 는 주석 줄을 거부한다.
            - name: 배포 대상 설정 읽기
              run: grep -vE '^\s*(#|$)' .github/deploy-targets/${{ github.ref_name }}.env >> "$GITHUB_ENV"

            # 인증서는 prod 만 쓴다. staging 은 nip.io 도메인이라 Caddy 가 스스로 발급받는다.
            - name: Create .env file
              run: |
                  echo "URL=${{ env.URL }}" > .env
                  if [ "${{ env.PROFILE }}" = "prod" ]; then
                    echo "CERTIFICATE=${{ secrets.CERTIFICATE }}" >> .env
                    echo "PRIVATE_KEY=${{ secrets.PRIVATE_KEY }}" >> .env
                  fi

            - name: SCP Command to Transfer Files
              uses: appleboy/scp-action@v1
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  port: ${{ env.SSH_PORT }}
                  key: ${{ secrets.SSH_KEY }}
                  source: "compose.caddy.yml, .env, ${{ env.CADDYFILE }}"
                  target: "~/proxy"
                  overwrite: true

            - name: SSH Command to Run Docker Compose
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ env.SSH_HOST }}
                  username: ${{ env.SSH_USER }}
                  port: ${{ env.SSH_PORT }}
                  key: ${{ secrets.SSH_KEY }}
                  script: |
                      cd ~/proxy
                      # staging 만 Caddyfile.dev 를 받는다. 컨테이너가 보는 이름은 한 가지다.
                      # ⚠️ `[ -f ] && mv` 로 쓰지 말 것 — prod 엔 파일이 없어 1 을 반환한다.
                      if [ -f caddy/Caddyfile.dev ]; then mv -f caddy/Caddyfile.dev caddy/Caddyfile; fi
                      source .env
                      # compose 설정 변경만 반영된다. Caddyfile 은 바인드 마운트라 아래 reload 가 필요하다.
                      docker compose -f compose.caddy.yml up -d --remove-orphans
                      # ⚠️ down → up 으로 바꾸지 말 것 — 설정 한 줄에 사이트 전체 TLS 가 끊긴다.
                      # reload 는 설정이 잘못되면 적용하지 않고 옛 설정을 유지한다.
                      for i in $(seq 1 15); do docker exec csereal_caddy caddy version >/dev/null 2>&1 && break; sleep 2; done
                      docker exec csereal_caddy caddy validate --config /etc/caddy/Caddyfile
                      docker exec csereal_caddy caddy reload --config /etc/caddy/Caddyfile
