on:
  push:
    branches:
      - main
    paths:
        - docker-compose-db.yml
        - .github/workflows/database.yaml

# 배포가 겹치면 안 된다. 특히 이건 상태를 가진 컨테이너를 다룬다.
# cancel-in-progress: false — 진행 중인 것을 중간에 끊으면 호스트가 어중간한 상태로 남는다.
concurrency:
    group: database-prod
    cancel-in-progress: false

jobs:
  database-deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Create .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=${{secrets.MYSQL_ROOT_PASSWORD}}" > .env
          echo "MYSQL_USER=${{secrets.MYSQL_USER}}" >> .env
          echo "MYSQL_PASSWORD=${{secrets.MYSQL_PASSWORD}}" >> .env
          echo "MYSQL_DATABASE=${{secrets.MYSQL_DATABASE}}" >> .env

      -
        name: SCP Command to Transfer Files
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          port: ${{secrets.SSH_PORT}}
          key: ${{secrets.SSH_KEY}}
          source: "docker-compose-db.yml, .env"
          target: "~/database"
          overwrite: true

      -
        name: SSH Remote Commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{secrets.SSH_USER}}
          port: ${{secrets.SSH_PORT}}
          key: ${{secrets.SSH_KEY}}
          script: |
            cd ~/database
            source .env
            # ⚠️ down 을 쓰지 않는다. 상태를 가진 DB 컨테이너를 굳이 없앴다 다시 만들 이유가
            #    없고, 그 사이 앱이 DB 를 잃는다. compose 는 이미지·설정이 바뀐 서비스만
            #    재생성하므로 up -d 만으로 이 파일의 변경이 반영된다.
            docker compose -f docker-compose-db.yml up -d --remove-orphans
