# monitor.log 회전 규칙.
#   설치: sudo cp scripts/logrotate.conf /etc/logrotate.d/csereal
#         sudo rm -f /etc/logrotate.d/monitor_app   # 옛 파일. 두면 같은 로그를 두 번 돌린다
#   검사: sudo logrotate -d /etc/logrotate.d/csereal   (-d 는 파싱만)
#
# ⚠️ 이것도 원래 호스트에만 있었다(/etc/logrotate.d/monitor_app). 여기가 정본이다.
# ⚠️ 로그 경로는 이 설정이 못박고 있으니 옮기려면 여기도 같이 고쳐야 한다.
#
# 감시 스크립트가 autoheal 로 대체되면 이 파일도 필요 없어진다 —
# 컨테이너 로그는 도커 로깅 드라이버가 알아서 돌린다(ops 컨테이너가 그렇게 한다).

/home/waffle/app/monitor.log {
    daily
    rotate 3
    compress
    missingok
    notifempty
    create 644 waffle waffle
}
