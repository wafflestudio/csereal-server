# 배포용 override (prod·staging 공통, PROFILE 로 갈린다).
#   docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
services:
    # 옛 docker-compose-db.yml 을 흡수했다. 별도 compose 프로젝트로 떼어 둔 이유는
    # "앱 배포가 down 으로 DB 까지 내리는 것"을 막기 위해서였는데, 배포에서 down 을
    # 없애 그 전제가 사라졌다. compose 는 이미지·설정이 바뀐 서비스만 재생성한다.
    #
    # 데이터 경로를 절대경로로 둬서 프로젝트가 어디서 돌든 같은 데이터를 본다 —
    # 통합에 데이터 이전이 필요 없었던 이유다.
    db:
        container_name: csereal_db_container
        volumes:
            - ${DB_DATA_DIR:-/home/waffle/database/db}:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        # 포트를 밖으로 내지 않는다. 같은 프로젝트라 앱이 서비스 이름으로 붙는다.
        # 전엔 프로젝트가 갈라져 앱이 호스트 게이트웨이를 거쳐야 했고, 그래서 3306 을
        # 0.0.0.0 에 열 수밖에 없었다(이 호스트엔 방화벽이 없다).
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
            interval: 10s
            timeout: 5s
            retries: 30
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        restart: always

    search:
        container_name: csereal_search
        image: "ghcr.io/wafflestudio/csereal-server/search_image:${PROFILE}"
        # 색인 데이터를 남기지 않는다. 앱이 기동할 때마다 DB 에서 전량 다시 만들기 때문에
        # 남겨도 쓰지 않고, 바인드 마운트는 호스트 소유권 때문에 기동을 막는다.
        healthcheck:
            retries: 30
            start_period: 90s
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        restart: always

    green:
        container_name: csereal_server_green
        image: "ghcr.io/wafflestudio/csereal-server/server_image:${PROFILE}"
        ports:
            - 8080:8080
        volumes:
            - ./cse-files:/app/cse-files
            - ./files:/app/files
            - ./logs:/app/logs
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        environment:
            SPRING_ELASTICSEARCH_URIS: http://search:9200
            # 같은 프로젝트라 서비스 이름으로 붙는다.
            SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true"
            SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
            SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
            OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
            OIDC_CLIENT_SECRET_DEV: ${OIDC_CLIENT_SECRET_DEV}
            URL: ${URL}
        # Caddy 는 이 컨테이너를 host.docker.internal:8080 으로 부른다(8080 게시 유지).
        depends_on:
            db: { condition: service_healthy }
            search: { condition: service_healthy }
        restart: always
