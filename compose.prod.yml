# 배포용 override (prod·staging 공통, PROFILE 로 갈린다).
#   docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
# MySQL 은 이 스택에 없다 — 호스트에서 별도 compose 프로젝트로 돈다(docker-compose-db.yml).
services:
    search:
        container_name: csereal_search
        image: "ghcr.io/wafflestudio/csereal-server/search_image:${PROFILE}"
        # 색인 데이터를 남기지 않는다. 앱이 기동할 때마다 DB 에서 전량 다시 만들기 때문에
        # 남겨도 쓰지 않고, 바인드 마운트는 호스트 소유권 때문에 기동을 막는다.
        healthcheck:
            retries: 30
            start_period: 90s
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        restart: always

    green:
        container_name: csereal_server_green
        image: "ghcr.io/wafflestudio/csereal-server/server_image:${PROFILE}"
        ports:
            - 8080:8080
        volumes:
            - ./cse-files:/app/cse-files
            - ./files:/app/files
            - ./logs:/app/logs
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        environment:
            SPRING_ELASTICSEARCH_URIS: http://search:9200
            SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true"
            SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
            SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
            OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
            OIDC_CLIENT_SECRET_DEV: ${OIDC_CLIENT_SECRET_DEV}
            URL: ${URL}
            SLACK_TOKEN: ${SLACK_TOKEN}
            SLACK_CHANNEL: ${SLACK_CHANNEL}
        extra_hosts:
            - host.docker.internal:host-gateway
        depends_on:
            search: { condition: service_healthy }
        restart: always
