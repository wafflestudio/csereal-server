# 배포용 override (prod·staging 공통, PROFILE 로 갈린다).
#   docker compose -f compose.yml -f compose.prod.yml up -d --remove-orphans
# MySQL 은 이 스택에 없다 — 호스트에서 별도 compose 프로젝트로 돈다(docker-compose-db.yml).
services:
    search:
        container_name: csereal_search
        image: "ghcr.io/wafflestudio/csereal-server/search_image:${PROFILE}"
        # 색인 데이터를 남기지 않는다. 앱이 기동할 때마다 DB 에서 전량 다시 만들기 때문에
        # 남겨도 쓰지 않고, 바인드 마운트는 호스트 소유권 때문에 기동을 막는다.
        healthcheck:
            retries: 30
            start_period: 90s
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        restart: always

    green:
        container_name: csereal_server_green
        image: "ghcr.io/wafflestudio/csereal-server/server_image:${PROFILE}"
        ports:
            - 8080:8080
        volumes:
            - ./cse-files:/app/cse-files
            - ./files:/app/files
            - ./logs:/app/logs
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "3"
        environment:
            SPRING_ELASTICSEARCH_URIS: http://search:9200
            # DB 는 별도 compose 프로젝트라 서비스 이름으로는 못 부른다. 공유 네트워크
            # csereal 에 양쪽이 붙어 컨테이너 이름으로 직접 통신한다.
            # 전엔 host.docker.internal 로 호스트 게이트웨이를 거쳤고, 그래서 MySQL 이
            # 3306 을 0.0.0.0 에 열어야 했다(이 호스트엔 방화벽이 없다).
            SPRING_DATASOURCE_URL: "jdbc:mysql://csereal_db_container:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true"
            SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
            SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
            OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
            OIDC_CLIENT_SECRET_DEV: ${OIDC_CLIENT_SECRET_DEV}
            URL: ${URL}
        # DB 는 공유 네트워크로 직접 붙으므로 게이트웨이 우회가 필요 없어졌다.
        # (Caddy 가 이 컨테이너를 host.docker.internal:8080 으로 부르는 건 그대로 —
        #  그건 Caddy 쪽 설정이고 8080 게시는 유지한다.)
        networks:
            - default
            - csereal
        depends_on:
            search: { condition: service_healthy }
        restart: always

networks:
    # DB 프로젝트(docker-compose-db.yml)와 공유한다.
    # 최초 1회 호스트에서 `docker network create csereal` 이 필요하다.
    csereal:
        external: true
